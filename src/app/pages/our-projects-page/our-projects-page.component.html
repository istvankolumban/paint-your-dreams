<div class="container">
  <div class="row">
    <div class="col my-2 d-flex justify-content-between">
      <h1 class="text-center mb-5 mt-3">Projektek</h1>
      <div *ngIf="!isCreating && !isEditing && isAuthenticated()">
        <button class="btn btn-primary mx-1" (click)="createProject()">
          <i class="bi bi-plus-lg"></i> Add New Project
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div *ngIf="isCreating">
        <app-project-details-edit
          [project]="newProject!"
          (projectSaved)="onProjectCreated()"
          (cancel)="onEditCanceled()"
        ></app-project-details-edit>
      </div>

      <div *ngIf="isEditing">
        <app-project-details-edit
          [project]="editedProject!"
          (projectSaved)="onProjectUpdated()"
          (cancel)="onEditCanceled()"
        ></app-project-details-edit>
      </div>
    </div>
  </div>

  <ng-container *ngIf="!isCreating && !isEditing">
    <div class="row mb-4">
      <div class="col-lg-6">
        <div class="search-bar mb-4">
          <label for="search" class="form-label">Keresés: </label>
          <input
            type="text"
            id="search"
            class="form-control"
            (input)="filterProjectsBySearch($event)"
            placeholder="Keress cím, időpont, helyszín vagy leírás alapján"
            [value]="searchValue"
          />
        </div>
      </div>
    </div>

    <div class="row d-none d-lg-flex">
      <div class="col-lg-6 mb-3">
        <ng-container *ngFor="let project of filteredProjects; let i = index">
          <ng-container *ngIf="i % 2 !== 1">
            <app-admin-header
              [index]="i"
              [maxIndex]="projects.length - 1"
              (edit)="editProject(project)"
              (delete)="deleteProject(project.id)"
              (moveUp)="moveUp(i)"
              (moveDown)="moveDown(i)"
            ></app-admin-header>
            <app-project-details [project]="project"></app-project-details>
          </ng-container>
        </ng-container>
      </div>
      <div class="col-lg-6 mb-3">
        <ng-container *ngFor="let project of filteredProjects; let i = index">
          <ng-container *ngIf="i % 2 !== 0">
            <app-admin-header
              [index]="i"
              [maxIndex]="projects.length - 1"
              (edit)="editProject(project)"
              (delete)="deleteProject(project.id)"
              (moveUp)="moveUp(i)"
              (moveDown)="moveDown(i)"
            ></app-admin-header>
            <app-project-details [project]="project"></app-project-details>
          </ng-container>
        </ng-container>
      </div>
    </div>

    <div class="row d-lg-none">
      <div class="col mb-3">
        <ng-container *ngFor="let project of filteredProjects; let i = index">
          <app-admin-header
            [index]="i"
            [maxIndex]="projects.length - 1"
            (edit)="editProject(project)"
            (delete)="deleteProject(project.id)"
            (moveUp)="moveUp(i)"
            (moveDown)="moveDown(i)"
          ></app-admin-header>
          <app-project-details [project]="project"></app-project-details>
        </ng-container>
      </div>
    </div>
  </ng-container>
</div>
