<button
  *ngIf="isLoggedIn"
  class="btn btn-primary mb-1"
  (click)="onEditProject()"
>
  <i class="bi bi-pencil"></i>
</button>
<button
  *ngIf="isLoggedIn"
  class="btn btn-danger mb-1 ms-1"
  (click)="onDeleteProject()"
>
  <i class="bi bi-trash"></i>
</button>
<div class="card mb-3">
  <img
    src="{{ project.coverImage.url }}"
    class="card-img-top"
    alt="{{ project.title }}"
  />
  <div class="card-body">
    <h5 class="card-title">{{ project.title }}</h5>
    <p>
      <b>Időpont:</b> {{ project.year }}, {{ project.month }}
      <br />
      <b>Helyszín:</b> {{ project.location }} <br />
      <b>Résztvevők:</b> {{ project.participants }} <br />
      <b>Programért felelős:</b>
      {{ project.organizers.join(", ") }}
    </p>
    <p
      class="mb-1"
      [innerHTML]="
        project.expanded
          ? project.description
          : (project.description | slice : 0 : 120) + '...'
      "
    ></p>
    <div *ngIf="project.expanded === true">
      <div id="column-wrapper-3">
        <ng-container *ngFor="let image of project.images; let i = index">
          <img [src]="image.url" alt="{{ project.title }}_{{ i }}" />
        </ng-container>
      </div>
    </div>
    <button
      class="btn btn-link p-0"
      (click)="project.expanded = !project.expanded"
    >
      {{ project.expanded ? "Kevesebb" : "Tovább" }}
    </button>
    <div *ngIf="isChangingOrder" class="d-flex justify-content-between mt-2">
      <button
        class="btn btn-outline-secondary"
        (click)="moveUp.emit()"
        *ngIf="project.order > 0"
      >
        <i class="bi bi-arrow-up"></i>
      </button>
      <button
        class="btn btn-outline-secondary"
        (click)="moveDown.emit()"
        *ngIf="project.order < maxOrder"
      >
        <i class="bi bi-arrow-down"></i>
      </button>
    </div>
  </div>
</div>
