<div class="mb-3">
  <form
    [formGroup]="projectForm"
    (ngSubmit)="saveProject()"
    class="border p-3 rounded"
  >
    <div class="mb-3">
      <app-asset-selector
        (assetSelected)="onCoverImageSelected($event)"
      ></app-asset-selector>
    </div>
    <div class="mb-3" *ngIf="projectForm.get('coverImage')?.value">
      <img
        [src]="projectForm.get('coverImage')?.value"
        class="img-fluid mb-3"
        alt="Cover Image"
      />
    </div>

    <div class="mb-3">
      <label for="title" class="form-label"
        >Title: <span class="text-danger">*</span></label
      >
      <input
        id="title"
        formControlName="title"
        type="text"
        class="form-control"
      />
      <div
        *ngIf="
          projectForm.get('title')?.invalid && projectForm.get('title')?.touched
        "
        class="text-danger"
      >
        Title is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label"
        >Description: <span class="text-danger">*</span></label
      >
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        rows="10"
      ></textarea>
      <div
        *ngIf="
          projectForm.get('description')?.invalid &&
          projectForm.get('description')?.touched
        "
        class="text-danger"
      >
        Description is required.
      </div>
      <small class="form-text text-muted">
        Use <b>&lt;p&gt;</b>new paragraph text<b>&lt;/p&gt;</b> for new parag
        aphs.
      </small>
    </div>

    <div class="mb-3">
      <label for="year" class="form-label">Year:</label>
      <input
        id="year"
        formControlName="year"
        type="number"
        class="form-control"
      />
      <div
        *ngIf="
          projectForm.get('year')?.invalid && projectForm.get('year')?.touched
        "
        class="text-danger"
      >
        Year is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="month" class="form-label">Month:</label>
      <input
        id="month"
        formControlName="month"
        type="text"
        class="form-control"
      />
      <div
        *ngIf="
          projectForm.get('month')?.invalid && projectForm.get('month')?.touched
        "
        class="text-danger"
      >
        Month is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="location" class="form-label">Location:</label>
      <input
        id="location"
        formControlName="location"
        type="text"
        class="form-control"
      />
      <div
        *ngIf="
          projectForm.get('location')?.invalid &&
          projectForm.get('location')?.touched
        "
        class="text-danger"
      >
        Location is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="participants" class="form-label">Participants:</label>
      <input
        id="participants"
        formControlName="participants"
        type="text"
        class="form-control"
      />
      <div
        *ngIf="
          projectForm.get('participants')?.invalid &&
          projectForm.get('participants')?.touched
        "
        class="text-danger"
      >
        Participants are required.
      </div>
    </div>

    <div class="mb-3">
      <label for="organizers" class="form-label"
        >Organizers: <span class="text-danger">*</span></label
      >
      <div formArrayName="organizers">
        <div
          *ngFor="let organizer of organizers.controls; let i = index"
          class="input-group mb-2"
        >
          <input [formControlName]="i" type="text" class="form-control" />
          <button
            type="button"
            class="btn btn-danger"
            (click)="removeOrganizer(i)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
      <button type="button" class="btn btn-primary" (click)="addOrganizer()">
        +
      </button>
      <div
        *ngIf="
          projectForm.get('organizers')?.invalid &&
          projectForm.get('organizers')?.touched
        "
        class="text-danger"
      >
        At least one organizer is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="images" class="form-label">Images:</label>
      <div formArrayName="images">
        <div
          *ngFor="let image of images.controls; let i = index"
          class="input-group mb-2"
        >
          <label class="form-control">{{ image.value }}</label>
          <button
            type="button"
            class="btn btn-danger"
            (click)="removeImage(i)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
        <div *ngFor="let image of projectForm.get('images')?.value" class="p-1">
          <img [src]="image" class="img-fluid" alt="Project Image" />
        </div>
      </div>
      <app-asset-selector
        (assetSelected)="onImageSelected($event)"
      ></app-asset-selector>
    </div>

    <div class="d-flex justify-content-between">
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="projectForm.invalid"
      >
        Save
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="projectSaved.emit()"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
