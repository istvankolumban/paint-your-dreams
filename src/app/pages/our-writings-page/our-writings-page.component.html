<div class="container">
  <div class="row">
    <div class="col my-2">
      <h1 class="text-center">Books</h1>
      <button (click)="createBook()" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Add New Book
      </button>
    </div>
  </div>
  <div class="row" *ngIf="isCreating">
    <div class="col my-2">
      <app-book-detailes-edit
        *ngIf="newBook"
        [book]="newBook"
        (bookSaved)="onBookSaved()"
      ></app-book-detailes-edit>
    </div>
  </div>
  <div class="row" *ngIf="isEditing">
    <div class="col my-2">
      <app-book-detailes-edit
        *ngIf="editedBook"
        [book]="editedBook"
        (bookSaved)="onBookSaved()"
      ></app-book-detailes-edit>
    </div>
  </div>
  <div class="row" *ngIf="!isCreating && !isEditing">
    <div class="col my-2" *ngFor="let book of books">
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between">
          <h5 class="card-title">{{ book.title }}</h5>
          <div>
            <button (click)="editBook(book)" class="btn btn btn-primary mb-1">
              <i class="bi bi-pencil"></i>
            </button>
            <button
              (click)="deleteBook(book.id)"
              class="btn btn-danger mb-1 ms-1"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
        <div class="card-body">
          <p class="card-text">{{ book.description }}</p>
          <!-- Book Component -->
          <app-book [pages]="book.pages"></app-book>
          <!-- Attachments Section -->
          <div class="attachments-container mt-3">
            <h5>Attachments</h5>
            <ul>
              <li *ngFor="let attachment of book.attachments">
                <a [href]="attachment.url" target="_blank">{{
                  attachment.name
                }}</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
