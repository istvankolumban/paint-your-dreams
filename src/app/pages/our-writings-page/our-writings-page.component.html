<div class="container">
  <div class="row">
    <div class="col my-2 d-flex justify-content-between">
      <h1 class="text-center">Books</h1>
      <div>
        <button
          *ngIf="isAuthenticated()"
          (click)="createBook()"
          class="btn btn-primary"
        >
          <i class="bi bi-plus-lg"></i> Add New Book
        </button>
        <button
          *ngIf="isAuthenticated() && !isChangingOrder"
          (click)="startChangingOrder()"
          class="btn btn-warning ms-2"
        >
          Change Order
        </button>
        <button
          *ngIf="isAuthenticated() && isChangingOrder"
          (click)="saveOrder()"
          class="btn btn-success ms-2"
        >
          Save Order
        </button>
      </div>
    </div>
  </div>
  <div class="row" *ngIf="isCreating">
    <div class="col my-2">
      <app-book-detailes-edit
        *ngIf="newBook"
        [book]="newBook"
        (bookSaved)="onBookSaved()"
      ></app-book-detailes-edit>
    </div>
  </div>
  <div class="row" *ngIf="isEditing">
    <div class="col my-2">
      <app-book-detailes-edit
        *ngIf="editedBook"
        [book]="editedBook"
        (bookSaved)="onBookSaved()"
      ></app-book-detailes-edit>
    </div>
  </div>
  <div class="row" *ngIf="!isCreating && !isEditing">
    <div class="col col-lg-12 my-2" *ngFor="let book of books; let i = index">
      <div *ngIf="isAuthenticated()">
        <button (click)="editBook(book)" class="btn btn btn-primary mb-1">
          <i class="bi bi-pencil"></i>
        </button>
        <button (click)="deleteBook(book.id)" class="btn btn-danger mb-1 ms-1">
          <i class="bi bi-trash"></i>
        </button>
        <button
          *ngIf="isChangingOrder && i > 0"
          (click)="moveUp(i)"
          class="btn btn-secondary mb-1 ms-1"
        >
          <i class="bi bi-arrow-up"></i>
        </button>
        <button
          *ngIf="isChangingOrder && i < books.length - 1"
          (click)="moveDown(i)"
          class="btn btn-secondary mb-1 ms-1"
        >
          <i class="bi bi-arrow-down"></i>
        </button>
      </div>
      <app-book-details
        [book]="book"
        [showAttachments]="true"
        [showOrderButton]="false"
      ></app-book-details>
    </div>
  </div>
</div>
