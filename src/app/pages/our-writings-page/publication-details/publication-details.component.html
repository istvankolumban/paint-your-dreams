<div *ngIf="publication" class="container mt-3">
  <div *ngIf="!editMode" class="card">
    <div class="card-body">
      <h2 class="card-title">{{ publication.title }}</h2>
      <p class="card-text"><strong>Description:</strong> {{ publication.description }}</p>
      <p class="card-text"><strong>Date:</strong> {{ publication.date }}</p>
      <p class="card-text"><strong>Authors:</strong> {{ publication.authors.join(", ") }}</p>
      <a [href]="publication.attachment.url" target="_blank" class="btn btn-primary">Open Attachment</a>
    </div>
  </div>

  <div *ngIf="editMode" class="card">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Title:</label>
        <input [(ngModel)]="publication.title" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label">Description:</label>
        <textarea [(ngModel)]="publication.description" class="form-control"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Date:</label>
        <input [(ngModel)]="publication.date" type="date" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label">Authors:</label>
        <input [(ngModel)]="publication.authors" class="form-control" />
      </div>
      <button (click)="onSave()" class="btn btn-success">Save</button>
      <button (click)="onCancel()" class="btn btn-secondary ms-2">Cancel</button>
    </div>
  </div>
</div>
