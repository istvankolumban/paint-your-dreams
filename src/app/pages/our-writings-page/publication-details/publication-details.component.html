<ng-container *ngIf="publication">
  <ng-container *ngIf="publication.visible || isAuthenticated()">
    <div *ngIf="!editMode" class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-primary">{{ publication.title }}</h5>

        <p class="text-muted mb-2">
          <i class="bi bi-calendar"></i> {{ publication.date }}
        </p>

        <p class="mb-2"><strong>Szerzők:</strong> {{ publication.authors }}</p>

        <p *ngIf="publication.description" class="card-text">
          {{ publication.description }}
        </p>

        <div *ngIf="publication.attachment" class="mt-3">
          <a
            [href]="publication.attachment.url"
            target="_blank"
            class="btn btn-outline-primary"
          >
            <i class="bi bi-file-earmark-text"></i> Publikáció megteknitése
          </a>
        </div>
      </div>
    </div>

    <div *ngIf="editMode" class="card">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Title:</label>
          <input [(ngModel)]="publication.title" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Description:</label>
          <textarea
            [(ngModel)]="publication.description"
            class="form-control"
          ></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Date:</label>
          <input
            [(ngModel)]="publication.date"
            type="date"
            class="form-control"
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Authors:</label>
          <input [(ngModel)]="publication.authors" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Attachment: </label>
          <app-asset-selector
            #assetSelector
            (assetSelected)="onAssetSelected($event)"
          ></app-asset-selector>
          <div *ngIf="publication.attachment" class="mt-3">
            <a
              [href]="publication.attachment.url"
              target="_blank"
              class="btn btn-outline-primary"
            >
              <i class="bi bi-file-earmark-text"></i>
              {{ publication.attachment.name }}
            </a>
          </div>
        </div>
        <button (click)="onSave()" class="btn btn-success">Save</button>
        <button (click)="onCancel()" class="btn btn-secondary ms-2">
          Cancel
        </button>
      </div>
    </div>
  </ng-container>
</ng-container>
