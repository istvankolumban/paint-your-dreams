<button type="button" class="btn btn-primary" (click)="showModal()">
  Select Asset
</button>

<div *ngIf="isModalVisible" class="modal" tabindex="-1" style="display: block;">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Select Asset</h5>
        <button type="button" class="btn-close" (click)="hideModal()"></button>
      </div>
      <div class="modal-body">
        <!-- Asset manager structure similar to asset-manager.component.html -->
        <div class="container mt-3">
          <div class="row">
            <div class="col-12 col-md-6 col-lg-5">
              <div *ngIf="rootFolder">
                <ng-container
                  *ngTemplateOutlet="folderTemplate; context: { folder: rootFolder }"
                ></ng-container>
              </div>
            </div>
            <div class="col-12 col-md-6 col-lg-7">
              <div *ngIf="selectedAsset">
                <ng-container *ngIf="isPdf(selectedAsset.name); else imageTemplate">
                  <iframe
                    [src]="selectedAsset.url | safeUrl"
                    width="100%"
                    height="600px"
                  ></iframe>
                </ng-container>
                <ng-template #imageTemplate>
                  <img
                    [src]="selectedAsset.url"
                    alt="{{ selectedAsset.name }}"
                    class="img-fluid"
                  />
                </ng-template>
              </div>
            </div>
          </div>
        </div>

        <ng-template #folderTemplate let-folder="folder">
          <div class="folder w-100">
            <div class="card mb-2">
              <div
                class="card-header folder-name d-flex justify-content-between align-items-center"
              >
                <div
                  (click)="folder.expanded = !folder.expanded"
                  class="d-flex align-items-center flex-grow-1"
                >
                  <i
                    class="bi"
                    [ngClass]="folder.expanded ? 'bi-folder2-open' : 'bi-folder'"
                  ></i>
                  {{ folder.name || "Assets" }}
                </div>
              </div>
              <ul class="list-group list-group-flush" *ngIf="folder.expanded">
                <li
                  class="list-group-item d-flex justify-content-between align-items-center"
                  *ngFor="let asset of folder.assets"
                >
                  <div
                    (click)="selectAsset(asset)"
                    [ngClass]="{ selected: selectedAsset === asset }"
                  >
                    <i class="bi bi-file-earmark"></i> {{ asset.name }}
                  </div>
                </li>
                <li class="list-group-item" *ngFor="let subFolder of folder.folders">
                  <ng-container
                    *ngTemplateOutlet="folderTemplate; context: { folder: subFolder }"
                  ></ng-container>
                </li>
              </ul>
            </div>
          </div>
        </ng-template>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="hideModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="saveSelection()">Save</button>
      </div>
    </div>
  </div>
</div>
